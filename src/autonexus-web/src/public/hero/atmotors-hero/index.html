<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AT MOTORS — Banner de referência</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #061222; }
    .hero-reference { width: 100%; overflow: hidden; }
    .hero-reference img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <!-- Prévia fiel do banner. Textos e botões são parte da imagem e NÃO são interativos. -->
  <main class="hero-reference">
    <img src="./hero-atmotors.png" alt="Banner AT MOTORS com SUV azul e apresentação da plataforma automotiva" />
  </main>
</body>
</html>
