name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: autonexus_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d autonexus_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore AutoNexus.slnx

      - name: Build
        run: dotnet build AutoNexus.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test AutoNexus.slnx --configuration Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Apply migrations and start API against PostgreSQL
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          ASPNETCORE_URLS: http://127.0.0.1:5080
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=autonexus_ci;Username=postgres
          Jwt__SecretKey: ${{ github.repository }}-${{ github.run_id }}-${{ github.sha }}-ci-only
        run: |
          # CI utiliza um PostgreSQL efemero; migrar antes de executar o seed da API.
          # A politica de migrations em producao permanece inalterada.
          dotnet tool install --global dotnet-ef --version 9.0.12
          dotnet ef database update --project src/AutoNexus.Infrastructure --startup-project src/AutoNexus.Api --configuration Release --no-build
          dotnet run --project src/AutoNexus.Api --configuration Release --no-build --no-launch-profile > /tmp/autonexus-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5080/health > /dev/null; then
              echo "API started successfully; PostgreSQL migrations and initialization completed."
              exit 0
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat /tmp/autonexus-api.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/autonexus-api.log
          echo "API did not become healthy after PostgreSQL initialization."
          exit 1

  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/autonexus-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/autonexus-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint (existing baseline debt)
        continue-on-error: true
        run: npm run lint

  docker-smoke:
    name: Docker ephemeral smoke and persistence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: ci-postgres-only
          JWT_SECRET_KEY: ci-only-jwt-secret-with-at-least-32-characters-123456
          CREDENTIAL_ENCRYPTION_KEY: ci-only-credential-encryption-key-123456789
        run: docker compose config --quiet
      - name: Build and start isolated containers
        env:
          POSTGRES_PASSWORD: ci-postgres-only
          JWT_SECRET_KEY: ci-only-jwt-secret-with-at-least-32-characters-123456
          CREDENTIAL_ENCRYPTION_KEY: ci-only-credential-encryption-key-123456789
        run: |
          docker compose up --build -d
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5000/health >/dev/null; then break; fi
            if [ "$attempt" -eq 60 ]; then docker compose logs --tail=100 api; exit 1; fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:3000/ >/dev/null
          docker compose exec -T postgres pg_isready -U autonexus -d autonexus
          docker compose exec -T api sh -c 'printf smoke-persist > /app/uploads/.ci-persistence-test'
          docker compose restart api
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/health >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then docker compose logs --tail=100 api; exit 1; fi
            sleep 3
          done
          docker compose exec -T api sh -c 'test "$(cat /app/uploads/.ci-persistence-test)" = smoke-persist'
          docker compose exec -T api rm /app/uploads/.ci-persistence-test
      - name: Inspect container privilege settings
        if: success()
        env:
          POSTGRES_PASSWORD: ci-postgres-only
          JWT_SECRET_KEY: ci-only-jwt-secret-with-at-least-32-characters-123456
          CREDENTIAL_ENCRYPTION_KEY: ci-only-credential-encryption-key-123456789
        run: |
          for service in api frontend postgres; do
            id="$(docker compose ps -q "$service")"
            docker inspect --format '{{json .HostConfig.SecurityOpt}}' "$id" | grep -q no-new-privileges
          done
      - name: Cleanup temporary CI containers and volumes
        if: always()
        env:
          POSTGRES_PASSWORD: ci-postgres-only
          JWT_SECRET_KEY: ci-only-jwt-secret-with-at-least-32-characters-123456
          CREDENTIAL_ENCRYPTION_KEY: ci-only-credential-encryption-key-123456789
        run: docker compose down --volumes --remove-orphans
