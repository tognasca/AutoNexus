name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autonexus_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d autonexus_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore AutoNexus.slnx

      - name: Build
        run: dotnet build AutoNexus.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test AutoNexus.slnx --configuration Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Apply migrations and start API against PostgreSQL
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          ASPNETCORE_URLS: http://127.0.0.1:5080
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=autonexus_ci;Username=postgres;Password=postgres
          Jwt__SecretKey: AutoNexus-CI-Only-Secret-Key-For-Migration-Check-2026!
        run: |
          dotnet run --project src/AutoNexus.Api --configuration Release --no-build --urls "$ASPNETCORE_URLS" > /tmp/autonexus-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5080/health > /dev/null; then
              echo "API started successfully; PostgreSQL migrations and initialization completed."
              exit 0
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat /tmp/autonexus-api.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/autonexus-api.log
          echo "API did not become healthy after PostgreSQL initialization."
          exit 1

  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/autonexus-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/autonexus-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint (existing baseline debt)
        continue-on-error: true
        run: npm run lint
